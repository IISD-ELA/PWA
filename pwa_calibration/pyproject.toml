[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pwa-calibration"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
authors = [
    {name = "IISD Experimental Lakes Area", email = "eladata@iisd.net"},
    {name = "Thomas Saleh", email = "tsaleh@iisd-ela.org"}
]
maintainers = [
    {name = "IISD Experimental Lakes Area", email = "eladata@iisd.net"},
    {name = "Thomas Saleh", email = "tsaleh@iisd-ela.org"},
    {name = "Idil Yaktubay", email = "iyaktubay@iisd-ela.org"}
]
description = "SPOTPY-driven calibration of Raven hydrological models for PWA"
readme = "README.md"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "geopandas>=0.14",
    "spotpy>=1.6",
    "netCDF4>=1.6",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "pwa-raven>=0.2.2,<1",
]
# mpi4py is required for parallel calibration but is left as an optional
# extra because it needs a system MPI install (OpenMPI / MPICH) which pip
# cannot provision. Install via:
#   conda install -c conda-forge mpi4py
# or
#   pip install mpi4py   # only after a system MPI is on PATH
#
# Raven binary is NOT a pip dependency. Install from:
#   http://raven.uwaterloo.ca/Downloads.html
# Place on PATH as 'Raven' (Linux/macOS) or 'Raven.exe' (Windows).

[project.urls]
Homepage = "https://www.iisd.org/ela/"
Organization = "https://www.iisd.org/"
Repository = "https://github.com/IISD-ELA/PWA"

[project.optional-dependencies]
mpi = ["mpi4py>=3.1"]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "regression: tests requiring real watershed data",
    "integration: tests that invoke Raven, MPI, or other external binaries",
    "slow: tests taking more than ~30 seconds (e.g. a real calibration run)",
]
