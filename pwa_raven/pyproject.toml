[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pwa-raven"
version = "0.1.0"
description = "Raven hydrological model setup and input generation for PWA"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "netCDF4>=1.6",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "lmoments3>=1.0.6",
    "matplotlib>=3.5",
]
# Raven binary is NOT a pip dependency. Install from:
#   http://raven.uwaterloo.ca/Downloads.html
# Place on PATH as 'Raven' (Linux/macOS) or 'Raven.exe' (Windows).

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "seaborn>=0.12",
    # xarray is an OPTIONAL runtime dep — init_nc_processing_config guards its
    # import and degrades gracefully without it (see _detect_netcdf_variables).
    # The auto-detect tests exercise the with-xarray path, so it's needed to
    # run the full suite.
    "xarray>=2023.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pwa_raven" = ["freq_analysis_tpl.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "regression: tests requiring real watershed data",
    "integration: tests that invoke Raven or other external binaries",
    "slow: tests taking more than ~30 seconds (e.g. a real Raven run)",
]
